---
# Agent skills shared by Claude Code and Codex.
#
# Layout: the canonical content lives under ~/.agents/skills (the vendor-neutral
# location Codex reads natively) and is symlinked into ~/.claude/skills, which is
# the only place Claude Code looks. No ~/.codex/skills symlinks are created:
# Codex already reads ~/.agents/skills, so a second copy there would make every
# skill appear twice in its selector.
#
# Git-backed entries are updated by "make converge". Add an optional
# "version: <branch|tag|sha>" to any git-backed
# skill to pin it; omit it to track the default branch.

# Skills maintained in this playbook under roles/skills/files/<name>.
agent_skills_local:
  - asd-ste100

# Skills whose entire git repository *is* the skill. Cloned directly into the
# canonical location (~/.agents/skills/<name>).
agent_skills_bare:
  - name: humanizer
    repo: https://github.com/blader/humanizer.git

# Monorepos that bundle one or more skills under a subdirectory. Each repo is
# cloned once into ~/.ansible/downloads/skills/<name>; the selected skill
# subdirectories are then symlinked into the canonical location. Use "all: true"
# to expose every skill under "subpath", or list explicit "skills" (subdirectory
# basenames).
agent_skills_monorepos:
  - name: humanlayer-skills
    repo: https://github.com/humanlayer/skills.git
    subpath: plugins/show-me/skills
    skills:
      - show-me
    auto_invoke: true
  - name: marketingskills
    repo: https://github.com/coreyhaines31/marketingskills.git
    subpath: skills
    all: true
  - name: anthropic-skills
    repo: https://github.com/anthropics/skills.git
    subpath: skills
    skills:
      - frontend-design
  - name: vercel-skills
    repo: https://github.com/vercel-labs/skills.git
    subpath: skills
    skills:
      - find-skills

# Note: the "clickup" skill is not listed here. It is generated by the cup CLI
# itself ("cup skill --print") and provisioned by the clickup-cli role so it
# always matches the installed CLI version. The mirror step below still picks it
# up from ~/.agents/skills.
