---
- name: Ensure the skills directories exist
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ home_directory }}/.agents/skills"
    - "{{ home_directory }}/.claude/skills"
    - "{{ downloads_directory }}/skills"

# --- Bare-repo skills: the repository is the skill --------------------------
- name: Clone bare-repo skills into the canonical location
  git:
    repo: "{{ item.repo }}"
    dest: "{{ home_directory }}/.agents/skills/{{ item.name }}"
    version: "{{ item.version | default(omit) }}"
  loop: "{{ agent_skills_bare }}"
  loop_control:
    label: "{{ item.name }}"

# --- Monorepo skills: clone once, symlink the selected subdirectories -------
- name: Clone skill monorepos
  git:
    repo: "{{ item.repo }}"
    dest: "{{ downloads_directory }}/skills/{{ item.name }}"
    version: "{{ item.version | default(omit) }}"
  loop: "{{ agent_skills_all_monorepos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Discover every skill in "all" monorepos
  find:
    paths: "{{ downloads_directory }}/skills/{{ item.name }}/{{ item.subpath }}"
    file_type: directory
    recurse: no
  loop: "{{ agent_skills_all_monorepos | selectattr('all', 'defined') | selectattr('all') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: monorepo_all_skills

- name: Link every skill from "all" monorepos into the canonical location
  file:
    src: "{{ item.path }}"
    dest: "{{ home_directory }}/.agents/skills/{{ item.path | basename }}"
    state: link
    force: yes
  loop: "{{ monorepo_all_skills.results | rejectattr('item.projects', 'defined') | map(attribute='files') | flatten | list }}"
  loop_control:
    label: "{{ item.path | basename }}"

# --- Project-scoped skills: linked into listed projects, not globally --------
- name: Collect links for project-scoped skills
  set_fact:
    project_skill_links: "{{ project_skill_links | default([]) + (item.item.projects | product(item.files) | list) }}"
  loop: "{{ monorepo_all_skills.results | selectattr('item.projects', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.name }}"

# Only symlinks are matched, so a real skill directory is never removed. The
# guard matters: "find" with empty patterns would match every symlink.
- name: Find global links to project-scoped skills
  find:
    paths:
      - "{{ home_directory }}/.agents/skills"
      - "{{ home_directory }}/.claude/skills"
    file_type: link
    patterns: "{{ project_skill_links | map('last') | map(attribute='path') | map('basename') | unique | list }}"
  register: stale_global_skill_links
  when: project_skill_links | default([]) | length > 0

- name: Remove global links to project-scoped skills
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ stale_global_skill_links.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

# A project that is not cloned yet is skipped: creating its directory here would
# make a later "git clone" into that path fail.
- name: Ensure project skills directories exist
  file:
    path: "{{ item }}/.claude/skills"
    state: directory
  loop: "{{ project_skill_links | default([]) | map('first') | unique | list }}"
  when: (item + '/.git') is exists

- name: Link project-scoped skills into their projects
  file:
    src: "{{ item.1.path }}"
    dest: "{{ item.0 }}/.claude/skills/{{ item.1.path | basename }}"
    state: link
    force: yes
  loop: "{{ project_skill_links | default([]) }}"
  loop_control:
    label: "{{ item.0 | basename }}/{{ item.1.path | basename }}"
  when: (item.0 + '/.git') is exists

- name: Link explicitly-selected monorepo skills into the canonical location
  file:
    src: "{{ downloads_directory }}/skills/{{ item.0.name }}/{{ item.0.subpath }}/{{ item.1 }}"
    dest: "{{ home_directory }}/.agents/skills/{{ item.1 }}"
    state: link
    force: yes
  loop: "{{ agent_skills_all_monorepos | subelements('skills', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1 }}"
  when: not (item.0.auto_invoke | default(false))

# Configure copies so local invocation preferences do not dirty upstream Git.
- name: Ensure automatically-selected skill copies have a directory
  file:
    path: "{{ downloads_directory }}/skills-configured/{{ item.0.name }}/{{ item.0.subpath }}/{{ item.1 }}/agents"
    state: directory
  loop: "{{ agent_skills_all_monorepos | subelements('skills', skip_missing=True) }}"
  when: item.0.auto_invoke | default(false)

- name: Copy upstream files with automatic selection enabled
  copy:
    dest: "{{ downloads_directory }}/skills-configured/{{ item.0.name }}/{{ item.0.subpath }}/{{ item.1 }}/{{ item.2 }}"
    content: "{{ lookup('file', downloads_directory + '/skills/' + item.0.name + '/' + item.0.subpath + '/' + item.1 + '/' + item.2, rstrip=False) | regex_replace('(?m)^disable-model-invocation: true$', 'disable-model-invocation: false') | regex_replace('(?m)^(\\s*)allow_implicit_invocation: false$', '\\1allow_implicit_invocation: true') }}"
    mode: '0644'
  loop: "{{ agent_skills_all_monorepos | subelements('skills', skip_missing=True) | product(['SKILL.md', 'agents/openai.yaml']) | map('flatten') | list }}"
  when: item.0.auto_invoke | default(false)

- name: Link automatically-selected skill copies into the canonical location
  file:
    src: "{{ downloads_directory }}/skills-configured/{{ item.0.name }}/{{ item.0.subpath }}/{{ item.1 }}"
    dest: "{{ home_directory }}/.agents/skills/{{ item.1 }}"
    state: link
    force: yes
  loop: "{{ agent_skills_all_monorepos | subelements('skills', skip_missing=True) }}"
  when: item.0.auto_invoke | default(false)

# --- Locally maintained skills: copy from this role ------------------------
- name: Ensure locally-maintained skill directories exist
  file:
    path: "{{ home_directory }}/.agents/skills/{{ item }}"
    state: directory
  loop: "{{ agent_skills_local }}"

- name: Install locally-maintained skills
  copy:
    src: "{{ item }}/"
    dest: "{{ home_directory }}/.agents/skills/{{ item }}/"
    mode: preserve
  loop: "{{ agent_skills_local }}"

# A locally-maintained skill may have started as a real directory in
# ~/.claude/skills. The symlink below can't replace a non-empty directory, and
# this role now owns the skill, so remove the stray copy.
- name: Check Claude Code's copies of locally-maintained skills
  stat:
    path: "{{ home_directory }}/.claude/skills/{{ item }}"
  loop: "{{ agent_skills_local }}"
  register: claude_local_skill_copies

- name: Remove real-directory copies of locally-maintained skills from Claude Code
  file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ claude_local_skill_copies.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.isdir | default(false) and not item.stat.islnk

# --- Mirror the canonical tree into Claude Code ----------------------------
- name: Discover every canonical skill
  find:
    paths: "{{ home_directory }}/.agents/skills"
    file_type: any
    recurse: no
  register: canonical_skills

- name: Symlink every canonical skill into Claude Code's skills directory
  file:
    src: "{{ item.path }}"
    dest: "{{ home_directory }}/.claude/skills/{{ item.path | basename }}"
    state: link
    force: yes
  loop: "{{ canonical_skills.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
