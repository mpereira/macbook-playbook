---
- name: Add Homebrew tap
  command: brew tap daviderestivo/emacs-head

- name: Install Emacs
  homebrew:
    name: "{{ build_emacs_formula }}"
    state: latest
    install_options: "{{ build_emacs_options }}"

# Do what the formula's icon options do on macOS 26 and later (see the comment
# on build_emacs_options): put the icon's Assets.car in the app and name it in
# Info.plist. Change the Homebrew app, not the copy in /Applications, so that
# the copy task below stays idempotent. An upgrade installs a new app, and the
# next run of this role sets the icon again.
- name: Set the Emacs.app icon
  shell: |
    set -eu
    app=/opt/homebrew/opt/{{ build_emacs_formula }}/Emacs.app
    car=/opt/homebrew/Library/Taps/daviderestivo/homebrew-emacs-head/icons/macos-26+/{{ build_emacs_icon }}.car
    plist="$app/Contents/Info.plist"
    changed=
    if ! cmp -s "$car" "$app/Contents/Resources/Assets.car"; then
      cp "$car" "$app/Contents/Resources/Assets.car"
      changed=1
    fi
    if [ "$(plutil -extract CFBundleIconName raw "$plist" 2>/dev/null || true)" != "{{ build_emacs_icon }}" ]; then
      plutil -replace CFBundleIconName -string "{{ build_emacs_icon }}" "$plist"
      changed=1
    fi
    # Without CFBundleIconName, macOS uses this .icns file instead.
    if plutil -extract CFBundleIconFile raw "$plist" >/dev/null 2>&1; then
      plutil -remove CFBundleIconFile "$plist"
      changed=1
    fi
    if [ -n "$changed" ]; then
      touch "$app"
      echo changed
    fi
  register: build_emacs_icon_set
  changed_when: "'changed' in build_emacs_icon_set.stdout"

# Spotlight lists apps only from real bundles, not symlinks, so copy the app.
# The copy still loads its Lisp files from the Cellar, so it has to be copied
# again after every upgrade; the task above upgrades first, so this run does
# that. After a manual `brew upgrade`, run this role again.
#
# Its name is plain Emacs.app so that typing "emacs" in Spotlight finds it
# first, and so it doesn't replace the emacsformacosx.com build, which is
# installed as Emacs-<version>.app.
#
# The --exclude keeps --delete from removing the emacsclient that the next
# task adds.
- name: Copy Emacs.app to /Applications so Spotlight lists it
  command: >
    rsync -a --delete --itemize-changes
    --exclude /Contents/MacOS/bin/
    /opt/homebrew/opt/{{ build_emacs_formula }}/Emacs.app/
    /Applications/Emacs.app/
  register: build_emacs_app_copy
  changed_when: build_emacs_app_copy.stdout | length > 0

# with-editor (Magit) needs an emacsclient with the same major version as the
# running Emacs. It finds the Cellar's bin/ only when Emacs runs from the
# Cellar, and /opt/homebrew/bin/emacsclient can belong to another emacs-head
# version, so put the matching one in Contents/MacOS/bin/, where with-editor
# also looks. emacsclient links only to libSystem, so it runs from anywhere.
- name: Copy emacsclient into /Applications/Emacs.app for with-editor
  command: >
    rsync -a --itemize-changes --mkpath
    /opt/homebrew/opt/{{ build_emacs_formula }}/bin/emacsclient
    /Applications/Emacs.app/Contents/MacOS/bin/
  register: build_emacs_emacsclient_copy
  changed_when: build_emacs_emacsclient_copy.stdout | length > 0
