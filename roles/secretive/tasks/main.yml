- name: Install Secretive
  community.general.homebrew_cask:
    name: secretive
    state: present

- name: Check whether the Secretive agent is running
  ansible.builtin.stat:
    path: "{{ secretive_agent_socket }}"
  register: secretive_socket

- name: Start Secretive for agent setup
  ansible.builtin.command:
    argv: [/usr/bin/open, -a, /Applications/Secretive.app]
  when: not secretive_socket.stat.exists
  changed_when: true

- name: Wait for the Secretive agent socket
  ansible.builtin.wait_for:
    path: "{{ secretive_agent_socket }}"
    timeout: 15
  when: not ansible_check_mode

- name: Read public identities from Secretive
  ansible.builtin.command:
    argv: [/usr/bin/ssh-add, -L]
  environment:
    SSH_AUTH_SOCK: "{{ secretive_agent_socket }}"
  register: secretive_identities
  changed_when: false
  failed_when: secretive_identities.rc not in [0, 1]
  check_mode: false
  when: secretive_socket.stat.exists or not ansible_check_mode

- name: Require explicit SSH host aliases
  ansible.builtin.assert:
    that:
      - item.hosts | length > 0
      - item.hosts | select('match', '^[A-Za-z0-9][A-Za-z0-9._-]*$') | list | length == item.hosts | length
    fail_msg: Specify individual SSH aliases in the hosts of '{{ item.name }}'.
  loop: "{{ secretive_all_keys }}"
  loop_control:
    label: "{{ item.name }}"

- name: Require each alias under one key
  ansible.builtin.assert:
    that: >-
      (secretive_all_keys | map(attribute='hosts') | flatten | length)
      == (secretive_all_keys | map(attribute='hosts') | flatten | unique | length)
    fail_msg: An SSH alias is listed under more than one Secretive key.

# Secretive comments each public key "<name with dashes>@secretive.<host>".
- name: Select each named Secure Enclave identity
  ansible.builtin.set_fact:
    secretive_selected_keys: >-
      {{ secretive_selected_keys | default({}) | combine({
           item.name: secretive_identities.stdout_lines | default([]) |
             select('search', ' ' ~ (item.name | replace(' ', '-') | regex_escape) ~ '@secretive\.') | list
         }) }}
  loop: "{{ secretive_all_keys }}"
  loop_control:
    label: "{{ item.name }}"

- name: Require unique key names
  ansible.builtin.assert:
    that: secretive_selected_keys[item.name] | length <= 1
    fail_msg: Give the Secretive key '{{ item.name }}' a unique name before running this role.
  loop: "{{ secretive_all_keys }}"
  loop_control:
    label: "{{ item.name }}"

- name: Explain first-time key creation
  ansible.builtin.debug:
    msg: >-
      Create '{{ item.name }}' in Secretive {{ item.protection }}, then rerun
      --tags touch-id-ssh. Enroll its public key on your servers before connecting.
  when: secretive_selected_keys[item.name] | length == 0
  loop: "{{ secretive_all_keys }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure the selected identities
  vars:
    secretive_found_keys: >-
      {{ secretive_all_keys | selectattr('name', 'in',
           secretive_selected_keys | dict2items | rejectattr('value', 'equalto', []) | map(attribute='key') | list) | list }}
  when: secretive_found_keys | length > 0
  block:
    - name: Ensure the SSH directory exists
      ansible.builtin.file:
        path: "{{ secretive_ssh_directory }}"
        state: directory
        mode: "0700"

    - name: Export the public keys for host identity selection
      ansible.builtin.copy:
        content: "{{ secretive_selected_keys[item.name][0] }}\n"
        dest: "{{ item.identity_file }}"
        mode: "0644"
      loop: "{{ secretive_found_keys }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Route selected SSH hosts through Secretive
      ansible.builtin.blockinfile:
        path: "{{ secretive_ssh_directory }}/config"
        insertbefore: BOF
        marker: "# {mark} ANSIBLE MANAGED SECRETIVE"
        create: true
        mode: "0600"
        backup: true
        block: |
          {% for key in secretive_found_keys %}
          {% for host in key.hosts %}
          Host {{ host }}
          {% if host in secretive_host_entries %}
              HostName {{ secretive_host_entries[host].hostname }}
              User {{ secretive_host_entries[host].user }}
          {% endif %}
              IdentityAgent "{{ secretive_agent_socket }}"
              IdentityFile "{{ key.identity_file }}"
              IdentitiesOnly yes
              ForwardAgent no

          {% endfor %}
          {% endfor %}
          Host *
