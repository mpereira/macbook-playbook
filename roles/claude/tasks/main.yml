---
- name: Install Claude
  homebrew_cask:
    name: claude
    state: present
    # Take over a Claude.app that wasn't installed with Homebrew. brew upgrade
    # doesn't accept --adopt, so upgrading is a separate task.
    install_options: adopt

- name: Upgrade Claude
  homebrew_cask:
    name: claude
    state: latest
    # Don't quit Claude.app, which may be running this playbook. The new
    # version starts the next time Claude opens.
    install_options: no-quit

- name: Ensure the Claude Code user directory exists
  file:
    path: "{{ home_directory }}/.claude"
    state: directory

# Claude Code loads ~/.claude/CLAUDE.md into every session as the user's
# instructions for all projects. Edit roles/claude/files/CLAUDE.md, not the
# installed copy, which the next run overwrites.
- name: Install Claude Code user instructions
  copy:
    src: CLAUDE.md
    dest: "{{ home_directory }}/.claude/CLAUDE.md"
    mode: "0644"

- name: Ensure the Claude Code managed settings directory exists
  file:
    path: "{{ claude_managed_settings_directory }}"
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  become: yes

- name: Install Claude Code managed settings
  copy:
    content: "{{ claude_managed_settings | to_nice_json(indent=2) }}\n"
    dest: "{{ claude_managed_settings_directory }}/managed-settings.json"
    owner: root
    group: wheel
    mode: "0644"
    backup: yes
  become: yes
