---
# Claude Code managed settings.
#
# Written to /Library/Application Support/ClaudeCode/managed-settings.json,
# owned by root. Managed settings take precedence over user, project, local,
# and --settings values, and Claude can't edit the file without sudo. They
# apply to the Claude Code CLI and to the Claude desktop app's Code tab.
# The file doesn't touch ~/.claude/settings.json, which Claude Code also writes
# to itself (theme, /model, and so on).
#
# See https://code.claude.com/docs/en/managed-settings and
# https://code.claude.com/docs/en/sandboxing.

claude_managed_settings_directory: /Library/Application Support/ClaudeCode

# Paths Claude must not write to. Each one becomes an Edit deny rule (for
# Claude's file tools) and a sandbox denyWrite entry (for Bash and every
# process it starts).
claude_write_protected_paths:
  - ~/.ssh
  - ~/.aws
  - ~/.gnupg
  - ~/.config/gh

# Commands that run outside the Bash sandbox, with full access. Git hooks run
# with them, and Claude can edit hook configuration such as lefthook.yml in
# the working directory, so these make the sandbox a guard against accidents
# rather than a security boundary.
claude_sandbox_excluded_commands:
  # Most git remotes here use SSH, which can't reach the network from inside
  # the sandbox.
  - git fetch
  - git fetch *
  - git pull
  - git pull *
  - git push
  - git push *
  - git ls-remote *
  # lefthook runs hooks in a pseudo-terminal, which the sandbox blocks.
  - git commit
  - git commit *
  # These write .git/config, which the sandbox always protects.
  - git worktree add *
  - git branch --set-upstream-to*
  # The sandbox blocks process listing.
  - ps
  - ps *
  # contextualize.ai database targets. The sandbox's proxy only carries web
  # traffic, so Atlas and the type sync can't reach Postgres from inside it.
  # The Atlas patterns end in ENV=development: make uses the last assignment
  # of a variable on its command line, so a match always targets development.
  # The type sync targets always read the development configuration.
  - make apply_atlas_database_migrations PROJECT=* ENV=development
  - make plan_atlas_database_schema PROJECT=* ENV=development
  - make apply_atlas_database_schema PROJECT=* PLAN_SHA256=* ENV=development
  - make python_app_write_database_types APP=*
  - make frontend_app_write_database_types APP=*
  # The sandbox blocks OrbStack's Docker socket. A container can mount any
  # host path, so these can write anywhere.
  - docker
  - docker *
  # openshell's end-to-end tasks, which start gateways in Docker. Claude Code
  # reads a pattern ending in ":*" as the command before the colon followed by
  # a space, so "e2e:*" wouldn't match "e2e:chaos".
  - mise run e2e*

# Unsandboxed commands that run without a permission prompt.
claude_allowed_unsandboxed_commands:
  - git fetch *
  - git push *

# Where Ansible writes temporary files when Claude runs it. Its default,
# ~/.ansible, also holds the Galaxy token and the collections and plugins
# Ansible loads, so it stays unwritable from the sandbox.
claude_ansible_temporary_directory: /tmp/claude/ansible

claude_managed_settings:
  permissions:
    # WebFetch(domain:*) lets sandboxed commands reach any host. The sandbox
    # only restricts file writes here.
    allow: "{{ ['WebFetch(domain:*)'] + claude_allowed_unsandboxed_commands | map('regex_replace', '^(.*)$', 'Bash(\\1)') | list }}"
    deny: "{{ claude_write_protected_paths | map('regex_replace', '^(.*)$', 'Edit(\\1/**)') | list }}"
  env:
    ANSIBLE_LOCAL_TEMP: "{{ claude_ansible_temporary_directory }}/local"
    ANSIBLE_REMOTE_TEMP: "{{ claude_ansible_temporary_directory }}/remote"
  sandbox:
    enabled: true
    # Refuse to start instead of running commands unsandboxed.
    failIfUnavailable: true
    # Don't let Claude retry a blocked command outside the sandbox.
    allowUnsandboxedCommands: false
    # Go programs such as gh, terraform and gmailctl verify TLS certificates
    # through macOS's trustd service, which the sandbox otherwise blocks.
    enableWeakerNetworkIsolation: true
    excludedCommands: "{{ claude_sandbox_excluded_commands }}"
    filesystem:
      denyWrite: "{{ claude_write_protected_paths }}"
  # Keep the restrictions the desktop app passes to Claude Code. Without this,
  # Claude Code drops them whenever a managed settings file exists.
  parentSettingsBehavior: merge
