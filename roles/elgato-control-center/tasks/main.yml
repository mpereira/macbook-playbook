---
# elgato-control-center moved into Homebrew's main cask repository, and
# GitHub deleted the tap's repository. Fetching it now asks for GitHub
# credentials, which shows a Keychain prompt every time brew updates.
- name: Remove the old homebrew/cask-drivers tap
  homebrew_tap:
    name: homebrew/cask-drivers
    state: absent

- name: Install elgato-control-center
  homebrew_cask:
    name: elgato-control-center
    state: latest
