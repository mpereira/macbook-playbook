---
- name: Install ClickUp CLI
  homebrew:
    name: krodak/tap/clickup-cli
    state: latest

# The agent skill is generated by the CLI itself ("cup skill --print"), so it
# always matches the installed version. The canonical copy lives in
# ~/.agents/skills (read by Codex) and is symlinked into ~/.claude/skills for
# Claude Code, matching the layout the "skills" role manages.
- name: Ensure the ClickUp skill directory exists
  file:
    path: "{{ home_directory }}/.agents/skills/clickup"
    state: directory

- name: Generate the ClickUp agent skill for the installed cup version
  command: cup skill --print
  register: clickup_skill
  changed_when: false

- name: Install the ClickUp skill into the canonical location
  copy:
    content: "{{ clickup_skill.stdout }}\n"
    dest: "{{ home_directory }}/.agents/skills/clickup/SKILL.md"

- name: Symlink the ClickUp skill into Claude Code's skills directory
  file:
    src: "{{ home_directory }}/.agents/skills/clickup"
    dest: "{{ home_directory }}/.claude/skills/clickup"
    state: link
    force: yes
